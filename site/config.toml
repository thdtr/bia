base_url = "https://bia-editor.netlify.app"
title = "BIA"
description = "A small code editor for Linux, macOS and Windows, written in Rust. No network code."
default_language = "en"
compile_sass = false
minify_html = false
generate_feeds = false
build_search_index = false

[markdown]
smart_punctuation = true
external_links_no_follow = false
external_links_no_referrer = true

[markdown.highlighting]
# BIA's own Noite and Dia, as VS Code themes for giallo. Class mode keeps
# inline styles out, so the CSP can stay strict.
extra_themes = ["highlight/bia-dia.json", "highlight/bia-noite.json"]
light_theme = "bia-dia"
dark_theme = "bia-noite"
style = "class"

[slugify]
paths = "safe"
anchors = "on"

[extra]
repo = "https://github.com/thdtr/bia"
install_sh = "curl -fsSL https://raw.githubusercontent.com/thdtr/bia/main/install.sh | sh"
install_ps1 = "irm https://raw.githubusercontent.com/thdtr/bia/main/install.ps1 | iex"
# Release assets, as named by .github/workflows/release.yml.
builds = [
  { os = "Linux", cpu = "x86_64", file = "bia-x86_64-unknown-linux-gnu.tar.gz" },
  { os = "Linux", cpu = "ARM64", file = "bia-aarch64-unknown-linux-gnu.tar.gz" },
  { os = "macOS", cpu = "apple", file = "bia-aarch64-apple-darwin.tar.gz" },
  { os = "macOS", cpu = "intel", file = "bia-x86_64-apple-darwin.tar.gz" },
  { os = "Windows", cpu = "x86_64", file = "bia-x86_64-pc-windows-msvc.zip" },
]


version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      iced:
        patterns: ["iced*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # The MSRV job pins the toolchain to the version in Cargo.toml (rust-version).
    # It isn't an action version, so it only changes when the MSRV does.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    # One pull request a month for all actions.
    groups:
      actions:
        patterns: ["*"]

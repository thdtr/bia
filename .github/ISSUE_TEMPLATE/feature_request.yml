name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        BIA tries to stay small, so new features start with a conversation here.
        [docs/ARCHITECTURE.md](https://github.com/thdtr/bia/blob/main/docs/ARCHITECTURE.md#not-in-bia-yet) lists what isn't in BIA yet.
        Features that need the network don't fit in BIA ([docs/SEALED.md](https://github.com/thdtr/bia/blob/main/docs/SEALED.md)), but we're glad to help find another way.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Could this live outside BIA?
      description: A theme, a grammar, a separate tool?

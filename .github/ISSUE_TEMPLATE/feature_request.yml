name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        BIA tries to stay small. Please check what's out of scope in
        [docs/ARCHITECTURE.md](https://github.com/thdtr/bia/blob/main/docs/ARCHITECTURE.md#out-of-scope) first.
        Features that need the network are out of scope ([docs/SEALED.md](https://github.com/thdtr/bia/blob/main/docs/SEALED.md)).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Could this live outside BIA?
      description: A theme, a grammar, a separate tool?

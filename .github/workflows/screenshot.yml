# Takes the screenshot used on the website: BIA on a real macOS desktop, open
# on a sample Next.js project (site/tools/screenshot/bookshelf). Run it by hand
# from the Actions tab and download the "screenshot" artifact.
name: Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bia

      # The runner's own screen only has 1x modes. Try a HiDPI virtual display
      # first, so the capture comes out at 2x.
      - name: HiDPI display
        id: hidpi
        continue-on-error: true
        run: |
          clang -fobjc-arc -framework Foundation -framework CoreGraphics \
            site/tools/screenshot/virtual-display.m -o virtual-display
          ./virtual-display > virtual-display.log 2>&1 &
          sleep 6
          cat virtual-display.log
          grep -q ' pixels' virtual-display.log
          system_profiler SPDisplaysDataType

      # Fallback: the runner's screen starts at 1024x768, too small for BIA's
      # 1180x760 window, so pick its largest 1x mode.
      - name: 1x display
        if: steps.hidpi.outcome != 'success'
        run: |
          brew install displayplacer
          displayplacer list | tee display.txt
          id=$(awk '/Persistent screen id:/ { print $4; exit }' display.txt)
          res=$(grep -E 'mode [0-9]+: res:' display.txt | sed -E 's/.*res:([0-9]+x[0-9]+).*/\1/' | sort -t x -n | tail -1)
          displayplacer "id:$id res:$res scaling:off"
          sleep 3

      - name: Capture
        env:
          BIA_CONFIG_DIR: ${{ runner.temp }}/bia
        run: |
          mkdir -p "$BIA_CONFIG_DIR" shots
          echo '{ "theme": "noite", "language": "en" }' > "$BIA_CONFIG_DIR/settings.json"
          defaults write -g AppleInterfaceStyle Dark
          p=site/tools/screenshot/bookshelf
          ./target/release/bia "$p" "$p/app/page.tsx" "$p/app/api/books/[id]/route.ts" &
          pid=$!
          sleep 15
          osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" || true
          sleep 3
          id=$(swift site/tools/screenshot/window-id.swift "$pid")
          screencapture -x -l "$id" shots/bia-macos.png
          screencapture -x shots/desktop.png
          sips -g pixelWidth -g pixelHeight shots/*.png

      - uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: shots/

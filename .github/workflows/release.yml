name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 so the binary runs on older glibc (Debian 12, Ubuntu 22.04, RHEL 9).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # GitHub retired its Intel macOS runners, so Intel builds are
          # cross-compiled on Apple silicon. They can't run tests there.
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
        if: matrix.test
      - run: cargo build --release --locked -p bia --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="bia-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bia" assets/linux/bia.desktop assets/icons/bia.svg \
             README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="bia-${{ matrix.target }}"
          version="${GITHUB_REF_NAME#v}"
          app="$name/BIA.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp "target/${{ matrix.target }}/release/bia" "$app/MacOS/bia"
          # Icon: render the PNG at every size macOS wants, then pack it.
          iconset="$(mktemp -d)/bia.iconset"; mkdir "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icons/bia.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d assets/icons/bia.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/bia.icns"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>BIA</string>
            <key>CFBundleDisplayName</key><string>BIA</string>
            <key>CFBundleIdentifier</key><string>io.github.thdtr.bia</string>
            <key>CFBundleExecutable</key><string>bia</string>
            <key>CFBundleIconFile</key><string>bia</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature: required for arm64 binaries to launch at all.
          codesign --force --deep --sign - "$name/BIA.app"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bia-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bia.exe", assets/icons/bia.ico, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bia-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bia-*
          generate_release_notes: true

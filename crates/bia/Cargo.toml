[package]
name = "bia"
description = "A happy minimalist code editor, with no network code."
version.workspace = true
# Built from this repository only: the crates read assets outside their folder.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "bia"
path = "src/main.rs"

[dependencies]
bia-core.workspace = true
iced = { version = "0.14", features = ["markdown", "advanced", "svg"] }
# Native "Open folder" dialog (XDG portal on Linux, no GTK).
rfd = "0.15"
# Deleting from the explorer moves to the OS trash. Never a hard delete.
trash = "5"

# Puts the app icon into bia.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true

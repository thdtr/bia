[package]
name = "bia"
description = "A happy minimalist code editor, with no network code."
version.workspace = true
# Built from this repository only: the crates read assets outside their folder.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "bia"
path = "src/main.rs"

[dependencies]
bia-core.workspace = true
iced = { version = "0.14", features = ["markdown", "advanced", "svg"] }
# The same Markdown parser iced uses: finds indented code blocks for the
# preview (see src/markdown.rs). No new crate in the build.
pulldown-cmark = { version = "0.12", default-features = false }
# Native "Open folder" dialog (XDG portal on Linux, no GTK).
rfd = "0.17"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Deleting from the explorer moves to the OS trash. Never a hard delete.
trash = "5"
# Cursor x positions: iced measures text by grapheme.
unicode-segmentation = "1"

# Puts the app icon into bia.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true

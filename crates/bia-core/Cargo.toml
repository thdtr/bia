[package]
name = "bia-core"
description = "GUI-independent core of the BIA editor: settings, themes, i18n, file tree, documents, history and languages."
version.workspace = true
# Built from this repository only: the crates read assets outside their folder.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Syntax definitions. `yaml-load` lets users drop `.sublime-syntax` files into
# their config folder; `regex-fancy` keeps the build 100% Rust (no C toolchain).
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
# ~200 curated grammars (the ones `bat` ships), precompiled.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# Reads the OS language on every platform (macOS GUI apps get no $LANG).
sys-locale = "0.3"
# Find, find in files: Unicode case folding, whole words and regular
# expressions. Its engine is already here through syntect's fancy-regex.
regex = "1"
# Walks a folder the way git sees it (.gitignore, .ignore, global excludes),
# for "open file by name" and "find in files". From ripgrep; no C code.
ignore = "0.4"
# The text of an open file. Edits anywhere cost the same in a 16 MB file
# as in a small one. Without `unicode_lines`, only `\n` breaks a line, as
# everywhere else in BIA.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Cursor motion by grapheme (é, emoji, flags are one step) and by word.
unicode-segmentation = "1"
# How many columns a character takes: 2 for CJK and most emoji.
unicode-width = "0.2"
# Line diffs for the git marks in the gutter. No dependencies of its own.
similar = { version = "2", default-features = false, features = ["text"] }

[lints]
workspace = true

# cargo-about configuration, used by tools/third_party_licenses.sh.
# Keep `accepted` in sync with [licenses] in deny.toml.

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
]

# Every platform there's a release for, so the file is the same everywhere.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# Only what ends up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# BIA's own crates (publish = false) are covered by LICENSE-MIT and LICENSE-APACHE.
[private]
ignore = true
